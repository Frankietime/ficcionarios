databases:
  - name: ficcionarios-db
    plan: free
    databaseName: ficcionarios

services:
  - type: web
    name: ficcionarios
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn server.app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ficcionarios-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"
